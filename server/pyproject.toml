[project]
name = "simile"
version = "0.1.0"
description = "Sim server for Simile, a village of LLM-driven NPCs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.15",
    "claude-agent-sdk>=0.2.167",
    "fastembed>=0.9.0",
    "feedparser>=6.0.14",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "resvg-py>=0.5.0",
    "starlette>=1.8",
    "trafilatura>=2.3.1",
    "typer>=0.27",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
simile = "simile.cli:main"

[project.optional-dependencies]
voice = [
    "mlx-audio>=0.5.9 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]
images = [
    "mflux>=0.23.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "hypothesis>=6.170.0",
    "jsonschema>=4.26.0",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-p", "pytester"]
markers = [
    "mlx: needs macOS on Apple Silicon with MLX installed; skipped everywhere else",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Never use the Claude API. LLM calls go through the L1 client over local Claude Code."
