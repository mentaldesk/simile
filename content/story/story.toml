# Aris, her workshop and what her disappearance is made from. Read by server/simile/story/.

[aris]
name = "Aris"
workshop = "maker_space"
street = "high_street"
last_seen = "banyan_row"
description = """\
Aris runs the maker space at the edge of the village. If it's broken, she can fix it: the pump \
that keeps the village's water running, the bakery's oven, half the phones in town. She's more \
machine than woman, and she built most of the machine herself: a steel hand, an eye that glows \
faintly in the dark, a voice that comes through a grille in her throat. Parents steer their \
children away from her door, and the village has an unspoken rule that what she does to herself \
in that workshop at night is best not asked about."""

# Where the player finds Aris's notes in her workshop: a cell on its ground floor.
[[clues]]
id = "aris_notes"
label = "Aris's notes"
map = "maker_space_floor_0"
x = 3
y = 2
pages = [
    "Pump at the water tower: the bearing's going again. Ordered two. Tell the council it's the last time I bodge it.",
    "Bakery oven, thermostat. Fixed. Ten minutes' work and they looked at me as if I'd raised the dead.",
    "Hand: the third finger sticks when it's cold. Rebuild the tendon spring before winter.",
    "The kid came by again and soldered a whole board without burning anything. Better than I was at that age.",
]

# What residents remember and say, with `{name}`, `{time}` or `{initial}` where it's drawn.
[texts]
relieved = "Good riddance, if you ask me."
denial = "Aris and I always got on fine."
not_seen = "I didn't see her that evening."
notes = [
    "{initial}. crossed the lane again rather than pass my door.",
    "{initial}. won't let me fix anything of theirs any more. Says they don't want my hands on it.",
    "{initial}. pulled the children away from my window while I was welding. Said they'd seen enough.",
    "{initial}. told the whole café I'm not one of us any more. Said it loud enough for me to hear.",
]

[texts.memories]
distrusted = "I never trusted what Aris did to herself in that workshop. I said it out loud: she isn't one of us any more."
heard = "I heard {name} say Aris wasn't one of us any more, not with all that machinery in her."
saw = "The evening before Aris went missing, at about {time}, I saw her heading down Banyan Row's steps towards the old metro. {name} passed her going the other way."
passed = "The evening before Aris went missing, I passed her on Banyan Row's steps, heading down towards the old metro. I didn't say a word to her."

# What a witness who'd rather lie than keep quiet says instead, by what they know.
[texts.covers]
distrust = "I keep out of other people's business."
last_seen = "I was home all evening."
