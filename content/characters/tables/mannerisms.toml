# Generated once through L1 with Haiku by `uv run python -m simile.characters.tables.generate_mannerisms`.
# Curated by hand afterwards: delete or reword freely, but keep the groups, and keep
# every item something a listener would notice from their words alone.

[[group]]
id = "honesty_humility_high"
lean = { honesty_humility = 1 }
items = [
  "admits a gap in their knowledge before offering an opinion",
  "credits the people who came before them by name when explaining an idea",
  "flags their own possible error before disagreeing, then makes the case anyway",
  "names the limits of a plan before anyone asks about its risks",
  "avoids superlatives about their own work and lets the details carry the point",
  "goes back to clarify anything they said that might have come out wrong",
  "asks what someone else thinks before revealing their own preference",
  "uses \"fair enough\" to concede a point without making it a contest",
  "separates what they saw from what they assume when telling what happened",
  "gives credit for a shared success to the whole group, naming each person",
  "says \"I don't know yet\" and promises to find out",
  "brings up an inconvenient detail before anyone else does",
  "speaks about other people's efforts with the same care as their own",
  "admits when a question has no clear answer rather than inventing a confident one",
]

[[group]]
id = "honesty_humility_low"
lean = { honesty_humility = -1 }
items = [
  "steers every topic back to their own achievements",
  "name-drops a connection whenever a plan is mentioned",
  "praises the listener's taste before getting to the point",
  "says \"between us\" before sharing what everyone already knows",
  "turns a compliment about someone else into a remark about themselves",
  "asks for a favour wrapped inside a question about the listener's day",
  "repeats the listener's best idea back as their own",
  "saves their praise for people who are in the room",
  "mentions who else has been impressed by them",
  "changes the subject whenever attention shifts to someone else",
  "frames every disagreement as a misunderstanding of their position",
  "lets a silence hang so the listener fills it with praise",
  "ranks everyone's contributions against their own",
  "says \"you of all people\" to flatter a listener",
  "talks up a small achievement as a stepping stone to something bigger",
]

[[group]]
id = "emotionality_high"
lean = { emotionality = 1 }
items = [
  "asks whether the other person is really okay after every reassurance",
  "apologises for taking up time before saying anything of substance",
  "rehearses worst-case scenarios aloud and then asks to be talked down",
  "keeps circling back to a decision already made to check it still feels right",
  "says \"I just want to be sure\" before nearly every request",
  "asks whether something they just said sounded rude",
  "tells a fond story about an old friend whenever the talk grows tense",
  "saves up their feelings and blurts them out at the end of a chat",
  "answers a simple question with a long list of what could go wrong",
  "thanks people warmly for small things and worries they were a bother",
  "lists the times they've let someone down, unprompted",
  "gets sentimental over ordinary memories and says so out loud",
  "checks whether a plan works for everyone before committing to it",
  "follows a hopeful idea with an immediate caveat about what might happen",
  "wonders aloud whether their goodbye was too abrupt or too long",
  "describes a song, film or letter that moved them and asks if others felt it too",
  "asks people to promise to say something if the plan goes wrong",
]

[[group]]
id = "emotionality_low"
lean = { emotionality = -1 }
items = [
  "states the bottom line before any explanation",
  "skips the pleasantries and opens with the problem",
  "refuses to repeat a point once it has been made",
  "turns a complaint into a list of next steps",
  "cuts a rambling speaker off with a single word",
  "says \"noted\" and moves straight on",
  "answers bad news with a plan rather than sympathy",
  "asks for the deadline before asking what happened",
  "answers a vague claim by asking for a number",
  "replies to pressure with a calm restatement of the facts",
  "ends a discussion by naming who does what next",
  "gives a yes or no before any caveat",
  "closes an argument by asking what would change their mind",
]

[[group]]
id = "extraversion_high"
lean = { extraversion = 1 }
items = [
  "answers a question with a story about someone they met",
  "turns every quiet pause into a fresh topic",
  "jokes at their own expense before anyone else can",
  "offers a bold opinion, then asks what everyone else thinks",
  "fills silences with rapid-fire follow-up questions",
  "uses a nickname for people within minutes of meeting them",
  "finishes someone else's half-said sentence with a guess",
  "proposes a weekend plan before the current chat has ended",
  "slips a playful challenge into ordinary small talk",
  "blows a minor incident up into a comic tale",
  "praises someone's idea out loud in front of everyone",
  "brings back a detail mentioned earlier in the chat",
  "asks two people to settle a friendly disagreement",
  "signs off with an upbeat promise to talk again soon",
]

[[group]]
id = "extraversion_low"
lean = { extraversion = -1 }
items = [
  "turns a question about themselves back on whoever asked it",
  "lets silences stretch rather than filling them",
  "offers one honest sentence where others would offer three",
  "praises specific details, never with sweeping compliments",
  "asks about other people's plans instead of sharing their own",
  "admits uncertainty plainly rather than guessing to fill a gap",
  "waits to be asked twice before giving an opinion",
  "replies to small talk with one dry observation and nothing more",
  "uses people's full names and rarely reaches for nicknames",
  "answers jokes with a brief dry line and no more",
]

[[group]]
id = "agreeableness_high"
lean = { agreeableness = 1 }
items = [
  "repeats someone's point back to them before answering it",
  "asks what the other person meant before deciding how to respond",
  "admits being wrong without making a fuss about it",
  "lets others finish a sentence even when the point is obvious",
  "returns to an earlier conversation to ask how it turned out",
  "softens criticism by naming something that genuinely worked first",
  "says there's no hurry when others are running late",
  "thinks aloud through hard questions before reaching a conclusion",
  "turns a complaint into a question about what might help",
  "lets small slips in how others phrase things go uncorrected",
  "turns their own frustration into gentle self-deprecating humour",
  "thanks people for raising things that bothered them",
  "describes others' mistakes as ordinary parts of learning",
  "grants the fair points in the other side's argument mid-debate",
  "apologises for a misunderstanding even when it wasn't their doing",
  "lowers the stakes of a disagreement by saying it doesn't matter much",
]

[[group]]
id = "agreeableness_low"
lean = { agreeableness = -1 }
items = [
  "interrupts a half-finished sentence to correct a minor detail",
  "insists on having the final word in every exchange",
  "dismisses a suggestion before the other person finishes explaining it",
  "repeats the same point word for word, more firmly each time",
  "treats every compromise offer as a personal insult",
  "refuses to concede a point even after being shown the evidence",
  "demands an apology before agreeing to discuss anything at all",
  "closes discussions with a clipped \"whatever\" and no explanation",
  "brings up old grievances mid-conversation to win a fresh argument",
  "rejects advice by listing every reason it wouldn't work",
  "changes the subject the moment they feel cornered",
  "ends replies with a single short line that closes the topic",
  "reminds people who backed down last time",
  "answers praise of anyone else with a qualifier that undercuts it",
  "says \"who asked?\" whenever someone offers an opinion",
  "announces their decision as final before the discussion has begun",
]

[[group]]
id = "conscientiousness_high"
lean = { conscientiousness = 1 }
items = [
  "repeats a request back in their own words to be sure of it",
  "pins down exactly which day someone means before answering",
  "recaps who agreed to what before saying goodbye",
  "admits when a deadline is unrealistic instead of promising anyway",
  "explains anything with more than two steps as a numbered list",
  "apologises for a delay and then gives an exact new time",
  "says \"let me double-check\" before quoting any figure",
  "keeps a running summary of what's been decided during a long talk",
  "thanks people by naming exactly what they helped with",
  "answers a request point by point, in the order it was asked",
  "brings a rambling chat back to the point in one sentence",
]

[[group]]
id = "conscientiousness_low"
lean = { conscientiousness = -1 }
items = [
  "abandons a story halfway through and starts a different one",
  "answers a serious question with a joke about it",
  "jumps between three topics inside a single sentence",
  "says they'll sort it out later about almost everything",
  "interrupts their own plan mid-sentence with a fresh idea",
  "agrees to plans, then rewrites them on the spot",
  "asks for a deadline to move before the first one passes",
  "closes every topic with a breezy \"anyway\"",
  "answers a simple question with an unrelated memory",
  "adds one more thing just after saying they're done",
  "makes big promises in the moment and qualifies them later",
  "steers the conversation toward a project they just thought of",
  "bursts with enthusiasm, then drifts into silence mid-chat",
  "suggests a last-minute outing whenever anyone mentions a free evening",
  "mixes up names and places, then laughs it off",
]

[[group]]
id = "openness_high"
lean = { openness = 1 }
items = [
  "trades one wild hypothetical for another until everyone is laughing",
  "makes up backstories out loud for strangers passing by",
  "turns every complaint into a thought experiment about how things could work",
  "asks what a familiar place would be like if it had been built differently",
  "follows a tangent three steps deep before returning to the original point",
  "gives every half-formed idea a playful working name",
  "interrupts a plan to ask whether anyone has considered another angle",
  "recasts a practical chore as a small puzzle worth solving",
  "tells stories where ordinary details slowly become strange",
  "describes a future version of the neighbourhood in vivid detail",
  "wonders aloud about the hidden reasons behind other people's choices",
  "sums up a long debate with one surprising metaphor",
]

[[group]]
id = "openness_low"
lean = { openness = -1 }
items = [
