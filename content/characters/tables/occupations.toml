# Jobs by ISCO-08 sub-major group. `employed` is the group's EU-27 employment in 2023, in
# thousands, from Eurostat's lfsa_egai2d; its titles share it equally. `skill` is ISCO-08's skill
# level for the group, and [skill] says how likely each education level is to hold a job at
# each skill level, 1 to 4. `ages` is who can hold the job, and a title can override it,
# `degree` (whether it needs a university degree) or `makes` (whether whoever does it makes or
# studies something, which casting's variety report counts). How it was made is in README.md.

[skill]
early_leaver = [3.0, 1.0, 0.25, 0.03]
school = [1.2, 1.0, 0.6, 0.15]
vocational = [0.8, 1.3, 0.9, 0.12]
degree = [0.25, 0.45, 1.0, 2.5]
postgraduate = [0.12, 0.25, 0.7, 3.5]

